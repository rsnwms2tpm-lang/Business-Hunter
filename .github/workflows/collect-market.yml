name: Collect Cornwall business listings

on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'
  push:
    branches: [main]
    paths:
      - 'collector.py'
      - '.github/workflows/collect-market.yml'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python collector.py
      - name: Commit refreshed market data
        run: |
          git config user.name "business-hunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Cornwall business listings"
          git pull --rebase origin main
          git push origin main
