<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827">
<title>Business Hunter</title><link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#111827;--muted:#667085;--line:#e5e7eb;--ok:#137333;--warn:#9a6700;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}header{position:sticky;top:0;z-index:10;background:rgba(244,246,248,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.wrap{max-width:980px;margin:auto;padding:16px}h1{font-size:26px;margin:0}.sub,.small{color:var(--muted);font-size:13px}.toolbar,.actions,.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,.btn,input,select{font:inherit}button,.btn{border:0;border-radius:12px;background:#111827;color:#fff;padding:10px 14px;font-weight:700;cursor:pointer}.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.tab.active{background:#111827;color:white}.filters{display:grid;grid-template-columns:1.4fr .8fr .8fr;gap:8px;margin:16px 0}input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.card h3{margin:0 0 4px;font-size:19px}.meta{color:var(--muted);font-size:13px}.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.score{font-weight:800;padding:6px 9px;border-radius:10px;background:#ecfdf3;color:var(--ok)}.score.mid{background:#fff7ed;color:var(--warn)}.score.low{background:#fef3f2;color:var(--bad)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.metric{background:#f8fafc;border-radius:10px;padding:10px}.metric b{display:block;font-size:16px}.metric span{font-size:11px;color:var(--muted)}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef2f6;font-size:12px;margin:6px 4px 0 0}.section{margin-top:12px}.section b{font-size:13px}.section p{margin:5px 0 0;color:#344054;font-size:14px;line-height:1.4}.notice{background:#fff;border:1px solid var(--line);padding:12px 14px;border-radius:12px;margin:14px 0}.empty{padding:40px;text-align:center;color:var(--muted)}.sync{display:flex;align-items:center;justify-content:space-between;gap:10px}.sync button{padding:7px 10px;font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(3,1fr)}.sync{align-items:flex-start;flex-direction:column}}
</style></head>
<body><header><div class="wrap"><h1>Business Hunter</h1><div class="sub">Live Cornwall market + your saved shortlist.</div><div class="tabs"><button id="liveTab" class="tab active" onclick="setView('live')">Live market</button><button id="savedTab" class="tab ghost" onclick="setView('saved')">Saved</button></div></div></header>
<main class="wrap"><div id="notice" class="notice small">Loading market feed…</div><div id="syncPanel" class="notice small" style="display:none"></div><div class="filters"><input id="search" placeholder="Search business or location…" oninput="render()"><select id="sourceFilter" onchange="render()"><option value="">All sources</option></select><select id="sort" onchange="render()"><option value="score">Best score</option><option value="priceLow">Lowest price</option><option value="profitHigh">Highest profit</option><option value="multipleLow">Lowest multiple</option></select></div><div id="summary" class="small" style="margin-bottom:10px"></div><div id="cards" class="grid"></div></main>
<script>
const KEY='businessHunterV1';
const SYNC_KEY='businessHunterSyncKeyV1';
const SUPABASE_URL='https://uehmbzwnbariqebbxcst.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFyaXFlYmJ4Y3N0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNjcyODIsImV4cCI6MjEwNDY0MzI4Mn0.zA_oLHdFNGi9nu5Z4zRT9dAMGGRjkXg5jyNwgf_n1Ok';
let saved=JSON.parse(localStorage.getItem(KEY)||'[]');let market=[];let meta={};let view='live';let workspaceCode='';
let syncKey=localStorage.getItem(SYNC_KEY);if(!syncKey){syncKey=crypto.randomUUID()+'-'+crypto.randomUUID();localStorage.setItem(SYNC_KEY,syncKey)}
function money(v){return v?new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:0}).format(v):'—'}function multiple(x){return x.profit>0&&x.price>0?x.price/x.profit:null}function score(x){let s=5,m=multiple(x);if(m){if(m<2.5)s+=2;else if(m<3.5)s+=1;else if(m>5)s-=2}if(x.profit>50000)s++;if((x.growth||'').length>35)s++;if((x.risks||'').toLowerCase().includes('owner'))s--;return Math.max(1,Math.min(10,s))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function makeWorkspaceCode(){const bytes=new TextEncoder().encode(syncKey);const hash=await crypto.subtle.digest('SHA-256',bytes);workspaceCode=[...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,8).toUpperCase();renderSyncPanel()}
function renderSyncPanel(){if(view!=='saved'){syncPanel.style.display='none';return}syncPanel.style.display='block';syncPanel.innerHTML=`<div class="sync"><div><b>ChatGPT sync is on</b><br>Your shortlist code is <b>${workspaceCode||'…'}</b>. Paste that code into our chat once, then I can read the businesses you save here and analyse them with you.</div><button class="ghost" onclick="copyCode()">Copy code</button></div>`}
async function copyCode(){if(!workspaceCode)return;try{await navigator.clipboard.writeText(workspaceCode);alert('Shortlist code copied. Paste it into our ChatGPT chat once.')}catch{prompt('Copy this shortlist code:',workspaceCode)}}
function setView(v){view=v;liveTab.className='tab '+(v==='live'?'active':'ghost');savedTab.className='tab '+(v==='saved'?'active':'ghost');renderSyncPanel();render()}
function persist(){localStorage.setItem(KEY,JSON.stringify(saved));render()}
function syncHeaders(extra={}){return {'apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON,'x-business-hunter-key':syncKey,'Content-Type':'application/json',...extra}}
function toRow(x){return {workspace_id:workspaceCode,listing_id:String(x.id),sync_key:syncKey,name:x.name||'Unnamed business',location:x.location||'',type:x.type||'',source:x.source||'',url:x.url||'',price:Number(x.price)||0,turnover:Number(x.turnover)||0,profit:Number(x.profit)||0,profit_measure:x.profitMeasure||'Unknown',rent:Number(x.rent)||0,growth:x.growth||'',risks:x.risks||'',notes:x.notes||'',raw:x,updated_at:new Date().toISOString()}}
async function pushSaved(items){if(!workspaceCode||!items.length)return;try{const r=await fetch(`${SUPABASE_URL}/rest/v1/business_hunter_saved?on_conflict=workspace_id,listing_id`,{method:'POST',headers:syncHeaders({'Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(items.map(toRow))});if(!r.ok)throw new Error(await r.text())}catch(e){console.warn('Shortlist sync deferred',e)}}
async function pullSaved(){if(!workspaceCode)return;try{const r=await fetch(`${SUPABASE_URL}/rest/v1/business_hunter_saved?workspace_id=eq.${workspaceCode}&select=raw`,{headers:syncHeaders()});if(!r.ok)throw new Error(await r.text());const rows=await r.json();const remote=rows.map(r=>r.raw).filter(Boolean);const by=new Map([...remote,...saved].map(x=>[String(x.id),x]));saved=[...by.values()];localStorage.setItem(KEY,JSON.stringify(saved));await pushSaved(saved);render()}catch(e){console.warn('Could not pull synced shortlist',e)}}
async function deleteRemote(id){if(!workspaceCode)return;try{await fetch(`${SUPABASE_URL}/rest/v1/business_hunter_saved?workspace_id=eq.${workspaceCode}&listing_id=eq.${encodeURIComponent(String(id))}`,{method:'DELETE',headers:syncHeaders()})}catch(e){console.warn('Remote remove deferred',e)}}
async function saveListing(id){const x=market.find(v=>String(v.id)===String(id));if(!x)return;if(saved.some(v=>String(v.id)===String(id))){alert('Already saved.');return}saved.unshift({...x,status:'Interesting'});persist();await pushSaved([saved[0]]);alert('Saved to your shortlist and synced for analysis.');}
async function removeSaved(id){saved=saved.filter(x=>String(x.id)!==String(id));persist();await deleteRemote(id)}
function render(){const q=search.value.toLowerCase().trim(),sf=sourceFilter.value;let xs=(view==='live'?market:saved).filter(x=>(!q||[x.name,x.location,x.type].join(' ').toLowerCase().includes(q))&&(!sf||x.source===sf));const sv=sort.value;xs.sort((a,b)=>sv==='priceLow'?(a.price||1e99)-(b.price||1e99):sv==='profitHigh'?(b.profit||0)-(a.profit||0):sv==='multipleLow'?(multiple(a)||1e99)-(multiple(b)||1e99):score(b)-score(a));summary.textContent=`${xs.length} ${view==='live'?'live':'saved'} business${xs.length===1?'':'es'} shown`;cards.innerHTML=xs.length?xs.map(card).join(''):'<div class="empty">Nothing to show yet.</div>'}
function card(x){const s=score(x),cls=s>=7?'':s>=5?'mid':'low',m=multiple(x);return `<article class="card"><div class="row"><div><h3>${esc(x.name)}</h3><div class="meta">${esc(x.location||'Cornwall')} · ${esc(x.type||'Uncategorised')}</div></div><span class="score ${cls}">${s}/10</span></div><div><span class="tag">${esc(x.source||'Source')}</span><span class="tag">${esc(x.profitMeasure||'Unknown profit measure')}</span></div><div class="metrics"><div class="metric"><b>${money(x.price)}</b><span>asking price</span></div><div class="metric"><b>${money(x.profit)}</b><span>stated profit</span></div><div class="metric"><b>${m?m.toFixed(1)+'×':'—'}</b><span>price/profit</span></div></div><div class="section"><b>Turnover</b><p>${money(x.turnover)} / year</p></div><div class="section"><b>Growth potential</b><p>${esc(x.growth||'Not assessed yet.')}</p></div><div class="section"><b>Risks / missing information</b><p>${esc(x.risks||'Not assessed yet.')}</p></div><div class="actions">${x.url?`<button onclick="window.open('${esc(x.url)}','_blank')">Open listing</button>`:''}${view==='live'?`<button class="ghost" onclick="saveListing('${esc(x.id)}')">Save</button>`:`<button class="ghost" onclick="removeSaved('${esc(x.id)}')">Remove</button>`}</div></article>`}
async function loadMarket(){try{const r=await fetch('market.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();market=j.listings||[];meta=j;const d=j.updated_at?new Date(j.updated_at).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'}):'unknown';notice.textContent=`Market feed: ${market.length} listings · ${j.region||'Cornwall'} · last refreshed ${d}. Automated figures are screening data only — verify against the seller advert and accounts.`;const sources=[...new Set(market.map(x=>x.source).filter(Boolean))].sort();sourceFilter.innerHTML='<option value="">All sources</option>'+sources.map(s=>`<option>${esc(s)}</option>`).join('');render()}catch(e){notice.textContent='Could not load the live market feed. Your saved shortlist is still available.';setView('saved')}}
async function boot(){await makeWorkspaceCode();await pullSaved();await loadMarket()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');boot();
</script></body></html>
