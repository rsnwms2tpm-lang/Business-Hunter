<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Business Hunter</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#111827;--muted:#667085;--line:#e5e7eb;--ok:#137333;--warn:#9a6700;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}header{position:sticky;top:0;z-index:10;background:rgba(244,246,248,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.wrap{max-width:980px;margin:auto;padding:16px}h1{font-size:26px;margin:0}.sub,.small{color:var(--muted);font-size:13px}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:12px;background:#111827;color:#fff;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.danger{background:#fff;color:var(--bad);border:1px solid #f1c7c2}.tab.active{background:#111827;color:#fff}.filters{display:grid;grid-template-columns:1.4fr .8fr;gap:8px;margin:16px 0}input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:white;font:inherit}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.card h3{margin:0 0 4px;font-size:19px}.meta{color:var(--muted);font-size:13px}.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.verdict{font-weight:800;padding:6px 9px;border-radius:10px;background:#ecfdf3;color:var(--ok);white-space:nowrap;font-size:12px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.metric{background:#f8fafc;border-radius:10px;padding:10px}.metric b{display:block;font-size:16px}.metric span{font-size:11px;color:var(--muted)}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef2f6;font-size:12px;margin:6px 4px 0 0}.analysis{background:#f8fafc;border-radius:12px;padding:12px;margin-top:14px}.section{margin-top:12px}.analysis .section:first-child{margin-top:0}.section b{font-size:13px}.section p{margin:5px 0 0;color:#344054;font-size:14px;line-height:1.4}.dismiss-note{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:12px;margin-top:12px}.dismiss-note b{font-size:13px}.dismiss-note p{margin:5px 0 0;color:#7c2d12;font-size:14px;line-height:1.4}.notice{background:#fff;border:1px solid var(--line);padding:12px 14px;border-radius:12px;margin:14px 0}.empty{padding:40px;text-align:center;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(3,1fr)}}
</style></head><body><header><div class="wrap"><h1>Business Hunter</h1><div class="sub">Our acquisition research log — businesses found, checked and compared.</div><div class="tabs"><button id="candidatesTab" class="tab active" onclick="setView('candidates')">Candidates</button><button id="savedTab" class="tab ghost" onclick="setView('saved')">Saved</button><button id="dismissedTab" class="tab ghost" onclick="setView('dismissed')">Dismissed</button></div></div></header><main class="wrap"><div id="notice" class="notice small">Loading research…</div><div class="filters"><input id="search" placeholder="Search business or location…" oninput="render()"><select id="sort" onchange="render()"><option value="research">Research order</option><option value="price">Lowest price</option><option value="profit">Highest profit</option><option value="multiple">Lowest price/profit</option></select></div><div id="summary" class="small" style="margin-bottom:10px"></div><div id="cards" class="grid"></div></main><script>
const SAVED='businessHunterV1',DISMISSED='businessHunterDismissedV1',SYNC_KEY='businessHunterSyncKeyV1';
const SUPABASE_URL='https://uehmbzwnbariqebbxcst.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlaG1ienduYmFyaXFlYmJ4Y3N0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNjcyODIsImV4cCI6MjEwNDY0MzI4Mn0.zA_oLHdFNGi9nu5Z4zRT9dAMGGRjkXg5jyNwgf_n1Ok';
let market=[],saved=JSON.parse(localStorage.getItem(SAVED)||'[]'),dismissed=JSON.parse(localStorage.getItem(DISMISSED)||'[]'),view='candidates';
let syncKey=localStorage.getItem(SYNC_KEY);if(!syncKey){syncKey=crypto.randomUUID()+'-'+crypto.randomUUID();localStorage.setItem(SYNC_KEY,syncKey)}
const money=v=>v?new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:0}).format(v):'—';const mult=x=>x.price&&x.profit?x.price/x.profit:null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function headers(){return {'apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON,'Content-Type':'application/json'}}
function setView(v){view=v;for(const n of ['candidates','saved','dismissed'])document.getElementById(n+'Tab').className='tab '+(v===n?'active':'ghost');render()}
function saveListing(id){const x=market.find(v=>String(v.id)===String(id));if(!x)return;if(!saved.some(v=>String(v.id)===String(id)))saved.unshift({...x,savedAt:new Date().toISOString()});localStorage.setItem(SAVED,JSON.stringify(saved));render()}
function removeSaved(id){saved=saved.filter(x=>String(x.id)!==String(id));localStorage.setItem(SAVED,JSON.stringify(saved));render()}
async function pushFeedback(x){try{await fetch(`${SUPABASE_URL}/rest/v1/rpc/business_hunter_feedback_push`,{method:'POST',headers:headers(),body:JSON.stringify({p_sync_key:syncKey,p_listing_id:String(x.id),p_name:x.name||'',p_reason:x.dismissReason||''})})}catch(e){console.warn('Could not sync dismissal feedback',e)}}
async function removeFeedback(id){try{await fetch(`${SUPABASE_URL}/rest/v1/rpc/business_hunter_feedback_remove`,{method:'POST',headers:headers(),body:JSON.stringify({p_sync_key:syncKey,p_listing_id:String(id)})})}catch(e){console.warn('Could not remove dismissal feedback',e)}}
async function dismissListing(id){const x=market.find(v=>String(v.id)===String(id))||saved.find(v=>String(v.id)===String(id));if(!x)return;const reason=prompt('Why are you dismissing this one?\n\nThis note helps improve future searches.','');if(reason===null)return;const item={...x,dismissReason:reason.trim(),dismissedAt:new Date().toISOString()};dismissed=dismissed.filter(v=>String(v.id)!==String(id));dismissed.unshift(item);saved=saved.filter(v=>String(v.id)!==String(id));localStorage.setItem(DISMISSED,JSON.stringify(dismissed));localStorage.setItem(SAVED,JSON.stringify(saved));render();await pushFeedback(item)}
async function editDismissNote(id){const i=dismissed.findIndex(x=>String(x.id)===String(id));if(i<0)return;const reason=prompt('Edit your dismissal note:',dismissed[i].dismissReason||'');if(reason===null)return;dismissed[i]={...dismissed[i],dismissReason:reason.trim()};localStorage.setItem(DISMISSED,JSON.stringify(dismissed));render();await pushFeedback(dismissed[i])}
async function restoreListing(id){dismissed=dismissed.filter(x=>String(x.id)!==String(id));localStorage.setItem(DISMISSED,JSON.stringify(dismissed));render();await removeFeedback(id)}
async function pullFeedback(){try{const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/business_hunter_feedback_pull`,{method:'POST',headers:headers(),body:JSON.stringify({p_sync_key:syncKey})});if(!r.ok)return;const rows=await r.json();for(const row of rows){let item=dismissed.find(x=>String(x.id)===String(row.listing_id));if(item){item.dismissReason=row.reason||item.dismissReason||'';continue}const source=market.find(x=>String(x.id)===String(row.listing_id));if(source)dismissed.push({...source,dismissReason:row.reason||'',dismissedAt:row.updated_at})}localStorage.setItem(DISMISSED,JSON.stringify(dismissed));render()}catch(e){console.warn('Could not load dismissal feedback',e)}}
function current(){if(view==='saved')return saved;if(view==='dismissed')return dismissed;const gone=new Set([...dismissed,...saved].map(x=>String(x.id)));return market.filter(x=>!gone.has(String(x.id)))}
function render(){const q=search.value.toLowerCase().trim();let xs=current().filter(x=>!q||[x.name,x.location,x.type,x.source,x.dismissReason].join(' ').toLowerCase().includes(q));if(sort.value==='price')xs.sort((a,b)=>(a.price||1e99)-(b.price||1e99));if(sort.value==='profit')xs.sort((a,b)=>(b.profit||0)-(a.profit||0));if(sort.value==='multiple')xs.sort((a,b)=>(mult(a)||1e99)-(mult(b)||1e99));summary.textContent=`${xs.length} ${view} · ${saved.length} saved · ${dismissed.length} dismissed`;cards.innerHTML=xs.length?xs.map(card).join(''):'<div class="empty">Nothing here at the moment.</div>'}
function card(x){const m=mult(x);const note=view==='dismissed'?`<div class="dismiss-note"><b>Why you dismissed it</b><p>${esc(x.dismissReason||'No reason added yet.')}</p></div>`:'';return `<article class="card"><div class="row"><div><h3>${esc(x.name)}</h3><div class="meta">${esc(x.location)} · ${esc(x.type)}</div></div><span class="verdict">${esc(x.verdict||'Research candidate')}</span></div><div><span class="tag">${esc(x.source)}</span><span class="tag">Checked ${esc(x.checked||'recently')}</span></div><div class="metrics"><div class="metric"><b>${money(x.price)}</b><span>asking price</span></div><div class="metric"><b>${money(x.profit)}</b><span>stated profit</span></div><div class="metric"><b>${m?m.toFixed(1)+'×':'—'}</b><span>price/profit</span></div></div><div class="small">Turnover ${money(x.turnover)} · ${esc(x.profitMeasure||'Profit measure unknown')}</div><div class="analysis"><div class="section"><b>Why I put it in front of you</b><p>${esc(x.assessment||'Worth recording for comparison.')}</p></div><div class="section"><b>What could kill the deal</b><p>${esc(x.concern||'Owner role, accounts and maintainable profit still need checking.')}</p></div></div>${x.notes?`<div class="section"><b>Research notes</b><p>${esc(x.notes)}</p></div>`:''}${note}<div class="actions">${x.url?`<button onclick="window.open('${esc(x.url)}','_blank')">Open listing</button>`:''}${view==='candidates'?`<button class="ghost" onclick="saveListing('${esc(x.id)}')">Save</button><button class="danger" onclick="dismissListing('${esc(x.id)}')">Dismiss</button>`:view==='saved'?`<button class="danger" onclick="dismissListing('${esc(x.id)}')">Dismiss</button><button class="ghost" onclick="removeSaved('${esc(x.id)}')">Unsave</button>`:`<button class="ghost" onclick="editDismissNote('${esc(x.id)}')">Edit note</button><button class="ghost" onclick="restoreListing('${esc(x.id)}')">Restore</button>`}</div></article>`}
async function boot(){try{const r=await fetch('market.json?ts='+Date.now(),{cache:'no-store'});const j=await r.json();market=j.listings||[];notice.textContent=`Research database: ${market.length} current candidates · ${j.region||'Cornwall'} · updated ${new Date(j.updated_at).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'})}. Dismissal notes feed back into future searches.`;render();await pullFeedback()}catch(e){notice.textContent='Could not load the research database.';render()}}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');boot();
</script></body></html>
