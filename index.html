<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827">
<title>Business Hunter</title><link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#111827;--muted:#667085;--line:#e5e7eb;--ok:#137333;--warn:#9a6700;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}header{position:sticky;top:0;z-index:10;background:rgba(244,246,248,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.wrap{max-width:980px;margin:auto;padding:16px}h1{font-size:26px;margin:0}.sub,.small{color:var(--muted);font-size:13px}.toolbar,.actions,.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,.btn,input,select{font:inherit}button,.btn{border:0;border-radius:12px;background:#111827;color:#fff;padding:10px 14px;font-weight:700;cursor:pointer}.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.tab.active{background:#111827;color:white}.filters{display:grid;grid-template-columns:1.4fr .8fr .8fr;gap:8px;margin:16px 0}input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.card h3{margin:0 0 4px;font-size:19px}.meta{color:var(--muted);font-size:13px}.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.verdict{font-weight:800;padding:6px 9px;border-radius:10px;background:#ecfdf3;color:var(--ok);white-space:nowrap}.verdict.mid{background:#fff7ed;color:var(--warn)}.verdict.low{background:#fef3f2;color:var(--bad)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.metric{background:#f8fafc;border-radius:10px;padding:10px}.metric b{display:block;font-size:16px}.metric span{font-size:11px;color:var(--muted)}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef2f6;font-size:12px;margin:6px 4px 0 0}.section{margin-top:12px}.section b{font-size:13px}.section p{margin:5px 0 0;color:#344054;font-size:14px;line-height:1.4}.analysis{background:#f8fafc;border-radius:12px;padding:12px;margin-top:14px}.analysis .section:first-child{margin-top:0}.notice{background:#fff;border:1px solid var(--line);padding:12px 14px;border-radius:12px;margin:14px 0}.empty{padding:40px;text-align:center;color:var(--muted)}.sync{display:flex;align-items:center;justify-content:space-between;gap:10px}.sync button{padding:7px 10px;font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(3,1fr)}.sync{align-items:flex-start;flex-direction:column}.verdict{font-size:12px}}
</style></head>
<body><header><div class="wrap"><h1>Business Hunter</h1><div class="sub">Live Cornwall market, ranked for your acquisition fit.</div><div class="tabs"><button id="liveTab" class="tab active" onclick="setView('live')">Live market</button><button id="savedTab" class="tab ghost" onclick="setView('saved')">Saved</button></div></div></header>
<main class="wrap"><div id="notice" class="notice small">Loading market feed…</div><div id="syncPanel" class="notice small" style="display:none"></div><div class="filters"><input id="search" placeholder="Search business or location…" oninput="render()"><select id="sourceFilter" onchange="render()"><option value="">All sources</option></select><select id="sort" onchange="render()"><option value="fit">Best fit for me</option><option value="priceLow">Lowest price</option><option value="profitHigh">Highest profit</option><option value="multipleLow">Lowest multiple</option></select></div><div id="summary" class="small" style="margin-bottom:10px"></div><div id="cards" class="grid"></div></main>
<script>
const KEY='businessHunterV1';
const SYNC_KEY='businessHunterSyncKeyV1';
const SUPABASE_URL='https://uehmbzwnbariqebbxcst.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlaG1ienduYmFyaXFlYmJ4Y3N0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNjcyODIsImV4cCI6MjEwNDY0MzI4Mn0.zA_oLHdFNGi9nu5Z4zRT9dAMGGRjkXg5jyNwgf_n1Ok';
let saved=JSON.parse(localStorage.getItem(KEY)||'[]'),market=[],meta={},view='live',workspaceCode='',syncState='Syncing…',profile={};
let syncKey=localStorage.getItem(SYNC_KEY);if(!syncKey){syncKey=crypto.randomUUID()+'-'+crypto.randomUUID();localStorage.setItem(SYNC_KEY,syncKey)}
function money(v){return v?new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:0}).format(v):'—'}function multiple(x){return x.profit>0&&x.price>0?x.price/x.profit:null}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function textOf(x){return [x.name,x.location,x.type,x.growth,x.risks,x.notes,x.description,x.profitMeasure].filter(Boolean).join(' ').toLowerCase()}
function has(t,words){return words.some(w=>t.includes(w))}
function analyse(x){
 const t=textOf(x),p=profile.preferences||{};let fit=0,reasons=[],warnings=[];
 const tech=has(t,['engineering','engineer','technical','manufactur','industrial','maintenance','mechanical','electrical','survey','consultancy','equipment','automotive','vehicle']);
 const b2b=has(t,['contract','commercial','repeat customer','customer base','recurring','clients','service business','maintenance']);
 const system=has(t,['team','staff','contracts','repeat','established customer','engineers','management','online','e-commerce','ecommerce']);
 const owner=has(t,['owner-operated','owner operated','owner role','seller relationships','proprietor','owner involvement','dependence on seller']);
 const quals=has(t,['qualification','qualified','certification','certified','gas safe','chartered','licence','license','specialist expertise']);
 const capital=has(t,['fleet','vehicle values','depreciation','machinery','heavy equipment','capex','stock at valuation']);
 const seasonal=has(t,['seasonal','tourism','tourist','holiday','summer']);
 const presence=has(t,['catering','bakery','restaurant','cafe','hospitality','retail shop']);
 const reloc=has(t,['relocatable','online','mobile','e-commerce','ecommerce','work from home']);
 if(tech){fit+=(p.technical_fit||5);reasons.push('Technical / engineering content looks transferable to your background.')}
 if(b2b){fit+=(p.b2b_repeat_revenue||4);reasons.push('Established B2B or repeat-customer characteristics are a good fit.')}
 if(system){fit+=(p.systemisable||5);reasons.push('There are signs this could be systemised rather than relying entirely on your own labour.')}
 if(reloc){fit+=(p.local_or_relocatable||3);reasons.push('Location or operating model gives useful flexibility.')}
 if(owner){fit-=(p.owner_dependency_penalty||5);warnings.push('Seller dependence may be hiding a replacement salary or relationship risk.')}
 if(quals){fit-=(p.qualification_barrier_penalty||5);warnings.push('Specialist qualifications may limit how much of the work you can personally replace.')}
 if(capital){fit-=(p.capital_intensity_penalty||3);warnings.push('Assets, stock or fleet could create hidden finance and replacement costs.')}
 if(seasonal){fit-=(p.seasonality_penalty||2);warnings.push('Seasonality could make headline annual profit less comfortable in cash-flow terms.')}
 if(presence){fit-=(p.lifestyle_owner_presence_penalty||5);warnings.push('This type of operation may demand regular owner presence and work against your time-freedom goal.')}
 const m=multiple(x);if(m&&m<2){fit+=5;reasons.push('Headline asking price is very low relative to stated profit.') }else if(m&&m<3){fit+=2;reasons.push('Headline valuation looks reasonable against stated profit.') }else if(m&&m>4){fit-=4;warnings.push('Headline valuation is expensive relative to stated profit.')}
 if((x.profitMeasure||'').toLowerCase().includes('midpoint')){fit-=3;warnings.push('The figures are range midpoints, not exact seller-reported numbers.')}
 if(!x.profit){fit-=2;warnings.push('No usable profit figure is available yet.')}
 let label='Mixed fit',cls='mid';if(fit>=9){label='Strong match';cls=''}else if(fit>=4){label='Worth investigating';cls=''}else if(fit<=-4){label='Low fit';cls='low'}
 let unknown='What does the owner actually do each week, and what would it cost to replace that work?';
 if(owner)unknown='How much revenue and profit depends on the seller personally, their labour or their relationships?';
 else if(quals)unknown='Which qualifications are legally or commercially essential, and can those skills be retained or hired?';
 else if(capital)unknown='Exactly which assets are owned, financed or due for replacement, and what is the true annual replacement cost?';
 else if(seasonal)unknown='What are monthly sales and cash flow outside the peak season?';
 else if((x.profitMeasure||'').toLowerCase().includes('midpoint'))unknown='What are the exact asking price, turnover and maintainable profit shown in the latest accounts?';
 let viewText;if(label==='Strong match')viewText='This deserves attention. The fit and headline economics are attractive enough to justify getting the missing facts before ruling it in or out.';else if(label==='Worth investigating')viewText='There is enough here to keep looking, but one or two unknowns could materially change the case.';else if(label==='Low fit')viewText='I would not prioritise this unless the advert is hiding something unusually attractive that changes the owner-dependence or valuation picture.';else viewText='The numbers or operating model are not yet convincing enough to rank this highly. Keep it visible, but do not chase it ahead of stronger matches.';
 return {fit,label,cls,reasons:reasons.slice(0,2),warnings:warnings.slice(0,2),unknown,viewText};
}
async function makeWorkspaceCode(){const bytes=new TextEncoder().encode(syncKey);const hash=await crypto.subtle.digest('SHA-256',bytes);workspaceCode=[...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,8).toUpperCase();renderSyncPanel()}
function renderSyncPanel(){if(view!=='saved'){syncPanel.style.display='none';return}syncPanel.style.display='block';syncPanel.innerHTML=`<div class="sync"><div><b>ChatGPT sync: ${esc(syncState)}</b><br>Your shortlist code is <b>${workspaceCode||'…'}</b>. Your private acquisition profile is ${Object.keys(profile).length?'active':'loading'}.</div><button class="ghost" onclick="copyCode()">Copy code</button></div>`}
async function copyCode(){if(!workspaceCode)return;try{await navigator.clipboard.writeText(workspaceCode);alert('Shortlist code copied.')}catch{prompt('Copy this shortlist code:',workspaceCode)}}
function setView(v){view=v;liveTab.className='tab '+(v==='live'?'active':'ghost');savedTab.className='tab '+(v==='saved'?'active':'ghost');renderSyncPanel();render()}
function persist(){localStorage.setItem(KEY,JSON.stringify(saved));render()}
function rpcHeaders(){return {'apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON,'Content-Type':'application/json'}}
function toRow(x){return {listing_id:String(x.id),name:x.name||'Unnamed business',location:x.location||'',type:x.type||'',source:x.source||'',url:x.url||'',price:Number(x.price)||0,turnover:Number(x.turnover)||0,profit:Number(x.profit)||0,profit_measure:x.profitMeasure||'Unknown',rent:Number(x.rent)||0,growth:x.growth||'',risks:x.risks||'',notes:x.notes||'',raw:x}}
async function pullProfile(){try{const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/business_hunter_profile_pull`,{method:'POST',headers:rpcHeaders(),body:JSON.stringify({p_sync_key:syncKey})});if(!r.ok)throw new Error(await r.text());profile=await r.json()||{};renderSyncPanel();render()}catch(e){console.warn('Profile load failed',e);profile={}}}
async function pushSaved(items){if(!workspaceCode||!items.length)return true;try{const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/business_hunter_push`,{method:'POST',headers:rpcHeaders(),body:JSON.stringify({p_sync_key:syncKey,p_rows:items.map(toRow)})});if(!r.ok)throw new Error(await r.text());syncState='On';renderSyncPanel();return true}catch(e){syncState='Retry needed';renderSyncPanel();console.warn('Shortlist sync failed',e);return false}}
async function pullSaved(){if(!workspaceCode)return;syncState='Syncing…';renderSyncPanel();try{const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/business_hunter_pull`,{method:'POST',headers:rpcHeaders(),body:JSON.stringify({p_sync_key:syncKey})});if(!r.ok)throw new Error(await r.text());const rows=await r.json();const remote=rows.map(r=>r.raw).filter(Boolean);const by=new Map([...remote,...saved].map(x=>[String(x.id),x]));saved=[...by.values()];localStorage.setItem(KEY,JSON.stringify(saved));const ok=await pushSaved(saved);if(ok)syncState='On';render()}catch(e){syncState='Retry needed';renderSyncPanel();console.warn('Could not pull synced shortlist',e)}}
async function deleteRemote(id){if(!workspaceCode)return;try{const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/business_hunter_remove`,{method:'POST',headers:rpcHeaders(),body:JSON.stringify({p_sync_key:syncKey,p_listing_id:String(id)})});if(!r.ok)throw new Error(await r.text());syncState='On';renderSyncPanel()}catch(e){syncState='Retry needed';renderSyncPanel();console.warn('Remote remove failed',e)}}
async function saveListing(id){const x=market.find(v=>String(v.id)===String(id));if(!x)return;if(saved.some(v=>String(v.id)===String(id))){alert('Already saved.');return}saved.unshift({...x,status:'Interesting'});persist();const ok=await pushSaved([saved[0]]);alert(ok?'Saved to your shortlist and synced for analysis.':'Saved locally. Sync will retry next time you open the app.');}
async function removeSaved(id){saved=saved.filter(x=>String(x.id)!==String(id));persist();await deleteRemote(id)}
function render(){const q=search.value.toLowerCase().trim(),sf=sourceFilter.value;let xs=(view==='live'?market:saved).filter(x=>(!q||[x.name,x.location,x.type].join(' ').toLowerCase().includes(q))&&(!sf||x.source===sf));const sv=sort.value;xs.sort((a,b)=>sv==='priceLow'?(a.price||1e99)-(b.price||1e99):sv==='profitHigh'?(b.profit||0)-(a.profit||0):sv==='multipleLow'?(multiple(a)||1e99)-(multiple(b)||1e99):analyse(b).fit-analyse(a).fit);summary.textContent=`${xs.length} ${view==='live'?'live':'saved'} business${xs.length===1?'':'es'} shown · ranked against your acquisition profile`;cards.innerHTML=xs.length?xs.map(card).join(''):'<div class="empty">Nothing to show yet.</div>'}
function card(x){const a=analyse(x),m=multiple(x),why=a.reasons.length?a.reasons.join(' '):'No strong personal-fit signal yet from the information available.',warn=a.warnings.length?a.warnings.join(' '):(x.risks||'No major risk signal extracted yet.');return `<article class="card"><div class="row"><div><h3>${esc(x.name)}</h3><div class="meta">${esc(x.location||'Cornwall')} · ${esc(x.type||'Uncategorised')}</div></div><span class="verdict ${a.cls}">${esc(a.label)}</span></div><div><span class="tag">${esc(x.source||'Source')}</span><span class="tag">${esc(x.profitMeasure||'Unknown profit measure')}</span></div><div class="metrics"><div class="metric"><b>${money(x.price)}</b><span>asking price</span></div><div class="metric"><b>${money(x.profit)}</b><span>stated profit</span></div><div class="metric"><b>${m?m.toFixed(1)+'×':'—'}</b><span>price/profit</span></div></div><div class="analysis"><div class="section"><b>Why it fits you</b><p>${esc(why)}</p></div><div class="section"><b>Critical unknown</b><p>${esc(a.unknown)}</p></div><div class="section"><b>Business Hunter view</b><p>${esc(a.viewText)}</p></div></div><div class="section"><b>Seller / listing risks</b><p>${esc(warn)}</p></div><div class="actions">${x.url?`<button onclick="window.open('${esc(x.url)}','_blank')">Open listing</button>`:''}${view==='live'?`<button class="ghost" onclick="saveListing('${esc(x.id)}')">Save</button>`:`<button class="ghost" onclick="removeSaved('${esc(x.id)}')">Remove</button>`}</div></article>`}
async function loadMarket(){try{const r=await fetch('market.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();market=j.listings||[];meta=j;const d=j.updated_at?new Date(j.updated_at).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'}):'unknown';notice.textContent=`Market feed: ${market.length} listings · ${j.region||'Cornwall'} · last refreshed ${d}. Business Hunter now ranks these against your acquisition profile; seller figures still need verification.`;const sources=[...new Set(market.map(x=>x.source).filter(Boolean))].sort();sourceFilter.innerHTML='<option value="">All sources</option>'+sources.map(s=>`<option>${esc(s)}</option>`).join('');render()}catch(e){notice.textContent='Could not load the live market feed. Your saved shortlist is still available.';setView('saved')}}
async function boot(){await makeWorkspaceCode();await pullProfile();await pullSaved();await loadMarket()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');boot();
</script></body></html>
